name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-latest já vem com o Android SDK (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar chave de assinatura (Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os Secrets da chave (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Veja o README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lancador-leve.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/lancador-leve.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Apagar chave do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/lancador-leve.jks"

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk lancador-leve.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lancador-leve-apk
          path: lancador-leve.apk

      - name: Publicar versão
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Lançador Leve 0.2.${{ github.run_number }}
          make_latest: true
          body: |
            APK pronto para instalar no projetor.
            Link fixo da última versão: https://github.com/${{ github.repository }}/releases/latest/download/lancador-leve.apk
          files: lancador-leve.apk
